<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Render de bolsas Dibaq</title>
<style>
  @font-face{font-family:"Fraunces";src:url(../fonts/fraunces-latin-normal.woff2) format("woff2");font-weight:100 900}
  @font-face{font-family:"Hanken Grotesk";src:url(../fonts/hanken-grotesk-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
  @font-face{font-family:"Authenia";src:url(../fonts/authenia.woff2) format("woff2")}
  html,body{margin:0;background:transparent}
  canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
</head>
<body>
<script src="../js/catalogo.js"></script>
<script type="module">
/* Renders a provisional 3D bag for each product in the catalog (window.renderBag(id) -> PNG data URL), in the
   language of the real packaging: Sense is a white bag with the "S" of fresh ingredients and a colored variety name;
   Natural Moments is a charcoal bag with the script logo, the "5 Star" seal and a colored recipe label.
   Driven by render-bolsas.mjs; open with ?id=<product id> to preview one bag in the browser. */
import * as THREE from "three";
import { RoomEnvironment } from "../vendor/RoomEnvironment.js";

const SIZE = { w: 1000, h: 1250 };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE.w, SIZE.h);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;

const camera = new THREE.PerspectiveCamera(24, SIZE.w / SIZE.h, 0.1, 50);
camera.position.set(0.55, 1.05, 4.6);
camera.lookAt(0, 0.74, 0);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(-0.5, 5, 3.4); // high and frontal so the shadow falls behind the bag
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
key.shadow.radius = 18; key.shadow.blurSamples = 24; key.shadow.bias = -0.0006;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.9);
rim.position.set(2.5, 1.6, -2.4);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Bag geometry: a gusseted pillow pouch with a crimped top seal ---------- */
const W = 1.0, HB = 1.42, D = 0.40, SEAL = 0.075;
function noise2(x, y) { // cheap smooth value noise
  const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s);
}
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function depthAt(v) { return (D / 2) * Math.pow(Math.max(0, 1 - Math.pow(v, 2.4)), 0.85) * (0.86 + 0.14 * smooth(0, 0.22, v)); }
function wrinkle(u, v) {
  const top = smooth(0.62, 1, v), edge = smooth(0.7, 1, Math.abs(u));
  return (Math.sin(u * 23 + v * 7) * 0.5 + Math.sin(u * 41 - v * 13) * 0.3 + (noise2(Math.round(u * 30), Math.round(v * 30)) - 0.5) * 0.4) * 0.0045 * (top + edge * 0.6);
}
function panel(sign) {
  const nx = 90, ny = 140, pos = [], uv = [], idx = [];
  for (let j = 0; j <= ny; j++) {
    const v = j / ny;
    for (let i = 0; i <= nx; i++) {
      const u = i / nx * 2 - 1;
      const dz = depthAt(v);
      const x = u * (W / 2) * (1 - 0.035 * (dz / (D / 2)) * Math.pow(Math.abs(u), 6)); // the seams pull in where the bag is fullest
      const z = sign * (dz * Math.pow(Math.max(0, 1 - u * u), 0.5) + wrinkle(u, v));
      pos.push(x, v * HB, z);
      uv.push(sign > 0 ? (u + 1) / 2 : 1 - (u + 1) / 2, v);
    }
  }
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = j * (nx + 1) + i, b = a + 1, c = a + nx + 1, d = c + 1;
    if (sign > 0) idx.push(a, b, d, a, d, c); else idx.push(a, d, b, a, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function bottom() { // oval gusset floor joining the bottom rows of both panels
  const nx = 90, pos = [], idx = [];
  for (let i = 0; i <= nx; i++) {
    const u = i / nx * 2 - 1, dz = depthAt(0) * Math.sqrt(Math.max(0, 1 - u * u));
    pos.push(u * W / 2, 0.0015, dz, u * W / 2, 0.0015, -dz);
  }
  for (let i = 0; i < nx; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* ---------- Label texture ---------- */
const cargar = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const ESE = await cargar("../img/marca/ese-ingredientes.webp");
const GATO = await cargar("../img/marca/gato.webp");
// color of each Natural Moments recipe label, as on the shelf: blue Complete Care, yellow sterilized, orange Ocean, pink kitten
const NM_COLOR = {
  "nm-gato-complete-care": "#3A6FB5", "nm-gato-esterilizado": "#E9B92F", "nm-gato-ocean-esterilizado": "#EE7D2B", "nm-gato-kitten": "#E58A9A",
  "nm-perro-ocean": "#2F8FB8", "nm-perro-mountain": "#5E8B3E", "nm-perro-mobility": "#C8453A", "nm-perro-ultralight": "#8DBF5A",
  "nm-perro-adulto-mediano": "#D9A53A", "nm-perro-adulto-mini": "#E77D5E", "nm-perro-cachorro-mediano": "#6BB5D9", "nm-perro-cachorro-grande": "#2E4C8C"
};
const SENSE_PERRO = "#3E9AD0", SENSE_GATO = "#7D5BA6";
function luminance(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(x => x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function spaced(ctx, text, x, y, spacing) { // letter-spaced text centered on x
  const chars = [...text], widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cx = x - total / 2;
  chars.forEach((ch, i) => { ctx.fillText(ch, cx + widths[i] / 2, y); cx += widths[i] + spacing; });
}
function wrapLines(ctx, text, maxW) { // one line if it fits, otherwise the most balanced two lines
  if (ctx.measureText(text).width <= maxW) return [text];
  const words = text.split(" ");
  let best = null;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
    const worst = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
    if (!best || worst < best.worst) best = { worst, lines: [a, b] };
  }
  return best.lines;
}
function etapa(p) {
  if (p.especie === "gato") return p.edad[0] === "cachorro" ? "GATITO" : p.necesidades.includes("esterilizado") ? "GATO ESTERILIZADO" : "GATO ADULTO";
  const e = p.edad[0] === "cachorro" ? "CACHORRO" : p.edad.includes("senior") ? "ADULTO Y SENIOR" : "ADULTO";
  const t = p.tamano.length === 3 ? "" : p.tamano[0] === "mini" ? " MINI" : p.tamano[0] === "mediano" ? " MEDIANO" : " GRANDE";
  return e + t;
}
function labelTexture(p) {
  const cw = 1200, ch = Math.round(cw * HB / W);
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const x = c.getContext("2d");
  const sense = p.linea === "sense";
  const base = sense ? "#F4F2EC" : "#1E1C18";
  x.fillStyle = base; x.fillRect(0, 0, cw, ch);
  const img = x.getImageData(0, 0, cw, ch), d = img.data; // fine paper grain
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * (sense ? 6 : 7); d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(img, 0, 0);
  x.textAlign = "center"; x.textBaseline = "alphabetic";
  const nombre = p.nombre.charAt(0).toUpperCase() + p.nombre.slice(1);
  const big = p.formatos ? p.formatos[p.formatos.length - 1] : "";
  if (sense) {
    const acento = p.acento || (p.especie === "gato" ? SENSE_GATO : SENSE_PERRO), tinta = "#33261F";
    x.fillStyle = tinta; x.font = "700 86px 'Hanken Grotesk'"; x.fillText("Dibaq", cw / 2, 205);
    x.font = "800 280px Fraunces"; x.fillText("Sense", cw / 2, 455);
    x.fillStyle = "#7A746E"; x.font = "600 30px 'Hanken Grotesk'"; spaced(x, p.especie === "gato" ? "HOLISTIC CAT FOOD" : "HOLISTIC DOG FOOD", cw / 2, 525, 9);
    // Grain Free badge
    x.strokeStyle = tinta; x.lineWidth = 4; x.beginPath(); x.arc(215, 690, 92, 0, 7); x.stroke();
    x.fillStyle = tinta; x.font = "600 50px Fraunces"; x.fillText("Grain", 215, 682); x.fillText("Free", 215, 732);
    // the S of fresh ingredients
    const sh = 700, sw = sh * ESE.width / ESE.height;
    x.drawImage(ESE, cw / 2 - sw / 2 + 80, 555, sw, sh);
    // variety name and stage
    x.textAlign = "left";
    x.fillStyle = acento; x.font = "700 92px 'Hanken Grotesk'";
    const lines = wrapLines(x, nombre, cw - 200);
    const y0 = 1395 + (lines.length === 1 ? 60 : 0);
    lines.forEach((l, i) => x.fillText(l, 100, y0 + i * 92));
    x.font = "600 30px 'Hanken Grotesk'"; x.fillStyle = acento; x.fillText("HIPOALERGÉNICO · GRAIN FREE", 102, y0 + (lines.length - 1) * 92 + 52);
    // stage pill
    x.font = "700 30px 'Hanken Grotesk'";
    const et = etapa(p), pw = x.measureText(et).width + 56;
    x.fillStyle = acento; x.beginPath(); x.roundRect(cw - 100 - pw, ch - 150, pw, 62, 31); x.fill();
    x.fillStyle = "#fff"; x.textAlign = "center"; x.fillText(et, cw - 100 - pw / 2, ch - 108);
    if (big) { x.fillStyle = tinta; x.font = "700 52px 'Hanken Grotesk'"; x.textAlign = "left"; x.fillText(big, 100, ch - 104); }
  } else {
    // Natural Moments: misty white top fading into a dark forest, black script logo, the pet in the mist, colored recipe label
    const col = p.acento || NM_COLOR[p.id] || "#C9A94E";
    const niebla = x.createLinearGradient(0, 0, 0, ch * 0.62);
    niebla.addColorStop(0, "#F4F4F2"); niebla.addColorStop(0.7, "#E2E3E0"); niebla.addColorStop(1, "#C9CBC7");
    x.fillStyle = niebla; x.fillRect(0, 0, cw, ch * 0.62);
    const r = (() => { let a = p.id.length * 97; return () => { a = (a * 9301 + 49297) % 233280; return a / 233280; }; })();
    const capa = (y0, alto, color, n) => { // a row of pines, each one narrow with a few tiers
      x.fillStyle = color; x.fillRect(0, y0, cw, ch - y0);
      for (let i = 0; i < n; i++) {
        const cx = (i + r() * 0.8) / n * cw, h = alto * (0.5 + r() * 0.6), wv = h * (0.22 + r() * 0.08);
        x.beginPath(); x.moveTo(cx, y0 - h);
        for (let k = 1; k <= 3; k++) { const yy = y0 - h + h * k / 3; x.lineTo(cx + wv * k / 3 + 6, yy); x.lineTo(cx + wv * k / 3 * 0.55, yy - 4); }
        for (let k = 3; k >= 1; k--) { const yy = y0 - h + h * k / 3; x.lineTo(cx - wv * k / 3 * 0.55, yy - 4); x.lineTo(cx - wv * k / 3 - 6, yy); }
        x.closePath(); x.fill();
      }
    };
    capa(ch * 0.6, 170, "#B8BCB7", 26);
    capa(ch * 0.645, 200, "#7B807B", 22);
    capa(ch * 0.69, 220, "#3A3C38", 18);
    capa(ch * 0.725, 160, "#22231F", 14);
    x.fillStyle = "#1E1C18"; x.fillRect(0, ch * 0.74, cw, ch * 0.26);
    // logo
    x.fillStyle = "#121110"; x.textAlign = "left"; x.font = "800 64px 'Hanken Grotesk'"; x.fillText("Dibaq", 110, 190);
    x.save(); x.translate(100, 330); x.rotate(-0.04); x.font = "150px Authenia"; x.fillText("Natural Moments", 0, 0); x.restore();
    // Five Star Menu seal
    x.fillStyle = "#121110"; x.beginPath(); x.arc(cw - 150, 470, 92, 0, 7); x.fill();
    x.fillStyle = "#E7D3A0"; x.textAlign = "center"; x.font = "700 34px 'Hanken Grotesk'"; x.fillText("★★★★★", cw - 150, 462);
    x.font = "700 21px 'Hanken Grotesk'"; spaced(x, "FIVE STAR", cw - 150, 500, 2); spaced(x, "MENU", cw - 150, 526, 2);
    // the pet in the mist (cats); dogs get the first ingredients
    if (p.especie === "gato") { const gh = 700, gw = gh * GATO.width / GATO.height; x.drawImage(GATO, cw / 2 - gw / 2, ch * 0.62 - gh + 120, gw, gh); }
    else {
      x.fillStyle = "#2B2A27"; x.textAlign = "left"; x.font = "500 44px 'Hanken Grotesk'";
      p.ingredientes.slice(0, 3).forEach(([n, v], i) => x.fillText(n + (v ? "  " + v : ""), 120, 560 + i * 70));
      x.fillStyle = "#5A5A56"; x.font = "500 32px 'Hanken Grotesk'"; x.fillText("Hierbas mediterráneas · Ingredientes naturales", 120, 560 + 3 * 70 + 6);
    }
    // recipe label on the dark band
    x.font = "800 88px Fraunces";
    const lines = wrapLines(x, nombre, cw - 320);
    const ly = Math.round(ch * 0.755) - (lines.length - 1) * 88; // two-line names get a taller label
    x.fillStyle = col; x.beginPath(); x.roundRect(90, ly, cw - 180, ch - ly - 80, 26); x.fill();
    const onCol = luminance(col) > 0.42 ? "#1A1A1A" : "#FFFFFF";
    x.fillStyle = onCol; x.textAlign = "left";
    x.font = "700 30px 'Hanken Grotesk'"; x.fillText(etapa(p), 142, ly + 70);
    x.font = "800 88px Fraunces";
    lines.forEach((l, i) => x.fillText(l, 140, ly + 160 + i * 88));
    x.font = "500 32px 'Hanken Grotesk'"; x.fillText(p.proteinas.join(" · "), 142, ch - 118);
    if (big) { x.textAlign = "right"; x.font = "700 50px 'Hanken Grotesk'"; x.fillText(big, cw - 140, ch - 118); }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return { tex: t, base };
}
function crimpTexture(base) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 32;
  const x = c.getContext("2d"); x.fillStyle = base; x.fillRect(0, 0, 512, 32);
  for (let i = 0; i < 512; i += 4) { x.fillStyle = "rgba(0,0,0,.18)"; x.fillRect(i, 4, 1.5, 24); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

let current = null;
function build(p) {
  if (current) { scene.remove(current); current.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } }); }
  const { tex, base } = labelTexture(p);
  const sense = p.linea === "sense";
  const film = { roughness: sense ? 0.62 : 0.5, clearcoat: sense ? 0.12 : 0.3, clearcoatRoughness: 0.35, sheen: 0.25, sheenRoughness: 0.6, sheenColor: new THREE.Color(sense ? 0xffffff : 0x666666) };
  const front = new THREE.Mesh(panel(1), new THREE.MeshPhysicalMaterial({ map: tex, ...film }));
  const back = new THREE.Mesh(panel(-1), new THREE.MeshPhysicalMaterial({ color: new THREE.Color(base), ...film }));
  const floor = new THREE.Mesh(bottom(), new THREE.MeshPhysicalMaterial({ color: new THREE.Color(base), ...film, side: THREE.DoubleSide }));
  const seal = new THREE.Mesh(new THREE.BoxGeometry(W * 0.985, SEAL, 0.012), new THREE.MeshPhysicalMaterial({ map: crimpTexture(base), ...film }));
  seal.position.y = HB + SEAL / 2 - 0.004;
  const g = new THREE.Group();
  [front, back, floor, seal].forEach(m => { m.castShadow = true; m.receiveShadow = false; g.add(m); });
  g.rotation.y = -0.32;
  scene.add(g);
  current = g;
}

await document.fonts.load("800 100px Fraunces");
await document.fonts.load("600 40px 'Hanken Grotesk'");
await document.fonts.load("100px Authenia");
window.renderBag = id => {
  const p = window.DIBAQ_CATALOGO.find(x => x.id === id);
  build(p);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/png");
};
window.ready = true;
const q = new URLSearchParams(location.search).get("id");
if (q) window.renderBag(q);
</script>
</body>
</html>
